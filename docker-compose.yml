services:
  postgres:
    image: postgres:16-alpine
    container_name: op-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-op_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-op_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - op-network

networks:
  op-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
